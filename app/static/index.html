<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Encore</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e5553a'/%3E%3Ctext x='16' y='24' text-anchor='middle' font-family='Georgia,serif' font-size='23' font-style='italic' fill='%23fff'%3EE%3C/text%3E%3C/svg%3E">
<style>
:root {
  --ink: #131316; --panel: #1b1b20; --raised: #25252b; --line: #34343c;
  --text: #f2eee6; --muted: #a5a2aa; --accent: #ef6a4c; --accent-ink: #1c0d09;
  --good: #7fcf9f; --warn: #eebb63; --bad: #f28b82;
}
* { box-sizing: border-box; }
html { color-scheme: dark; }
body { margin: 0; background: var(--ink); color: var(--text); font: 15px/1.45 system-ui, "Segoe UI", Roboto, sans-serif; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { display: flex; align-items: baseline; gap: 16px; padding: 22px 28px 0; }
.mark { margin: 0; font: italic 500 32px/1 Georgia, "Times New Roman", serif; letter-spacing: -.5px; }
.mark span { color: var(--accent); }
.health { margin-left: auto; color: var(--muted); font-size: 13px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: flex-end; }
.health .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--muted); }
.health .ok .dot { background: var(--good); }
.health .down { color: var(--bad); }
.health .down .dot { background: var(--bad); }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 28px; padding: 18px 28px 40px; align-items: start; }
.find { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
.find input { flex: 1 1 260px; min-width: 0; padding: 11px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
.find input::placeholder { color: var(--muted); }
.primary { padding: 10px 18px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.primary:hover { filter: brightness(1.08); }
.filters { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.filters button { padding: 9px 13px; border: 0; background: none; color: var(--muted); }
.filters button[aria-pressed="true"] { background: var(--raised); color: var(--text); }

.artists { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.artists:empty { display: none; }
.artists button { padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); font-size: 13px; }
.artists button:hover { border-color: var(--accent); }
.artists button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.artists button span { opacity: .7; font-weight: 400; margin-left: 4px; }
.hide-owned { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13px; white-space: nowrap; }
.hide-owned input { accent-color: var(--accent); }
.hidden-count { margin: -8px 0 12px; color: var(--muted); font-size: 13px; }
.hidden-count:empty { display: none; }
.side-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
[hidden] { display: none !important; }
.notice { padding: 44px 20px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; }
.notice.error { color: var(--bad); border-color: var(--bad); }
.notice strong { display: block; font: italic 22px Georgia, serif; color: var(--text); margin-bottom: 4px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
.album { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 14px; padding: 12px; background: var(--panel); border-radius: 10px; }
.album img, .job img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 5px; background: var(--raised); }
.album h3 { margin: 0; font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
.album .by { color: var(--muted); font-size: 13px; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 7px; font-size: 12px; color: var(--muted); }
.quality { padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.quality.top-tier { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.quality.hires { border-color: var(--accent); color: var(--accent); }
.owned { margin-top: 6px; font-size: 12px; color: var(--warn); overflow-wrap: anywhere; }
.actions { margin-top: 9px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.get, .small { padding: 5px 11px; border-radius: 6px; border: 1px solid var(--line); background: var(--raised); font-size: 13px; white-space: nowrap; }
.get:hover:not(:disabled), .small:hover { border-color: var(--accent); }
.get.main { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.get:disabled { cursor: default; background: none; color: var(--muted); }

.open { display: block; width: 100%; padding: 0; border: 0; background: none; text-align: left; }
.open:hover h3 { color: var(--accent); }
dialog { width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 48px); padding: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--text); }
dialog::backdrop { background: rgba(0, 0, 0, .65); }
.detail { padding: 22px; }
.detail-head { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 20px; }
.detail-head img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; background: var(--raised); }
.detail h2 { margin: 0 34px 2px 0; font: italic 26px/1.2 Georgia, serif; overflow-wrap: anywhere; }
.detail .by { color: var(--muted); }
.close { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border: 1px solid var(--line); border-radius: 50%; background: var(--raised); line-height: 1; }
.facts { margin-top: 8px; color: var(--muted); font-size: 13px; }
.award { margin-top: 8px; color: var(--warn); font-size: 13px; }
.disc { margin: 20px 0 4px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
.tracks { margin: 18px 0 0; padding: 0; list-style: none; }
.tracks li { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px; }
.tracks .num, .tracks .time { color: var(--muted); font-variant-numeric: tabular-nums; }
.tracks .num { text-align: right; }
.tracks small { display: block; color: var(--muted); font-size: 12px; }
.tracks li.locked { color: var(--muted); }
.tracks li.locked small { color: var(--warn); }
.missing { margin-top: 8px; color: var(--warn); font-size: 13px; }
.about { margin-top: 18px; color: var(--muted); font-size: 14px; }
.about summary { cursor: pointer; color: var(--text); }
.about p { white-space: pre-line; overflow-wrap: anywhere; }
.rights { margin: 16px 0 0; color: var(--muted); font-size: 12px; }
.side { position: sticky; top: 14px; padding: 16px; background: var(--panel); border-radius: 10px; max-height: calc(100vh - 28px); overflow: auto; }
.side h2 { margin: 0; font: italic 22px Georgia, serif; }
.setting { display: flex; gap: 8px; margin: 8px 0 14px; color: var(--muted); font-size: 13px; align-items: flex-start; }
.setting input { margin-top: 3px; accent-color: var(--accent); }
.jobs { display: grid; gap: 10px; }
.job { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.job b { display: block; font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }
.job .state { font-size: 12px; color: var(--muted); }
.job.done .state { color: var(--good); }
.job.failed .state { color: var(--bad); }
.job.done.import .state { color: var(--warn); }
.link { padding: 0; border: 0; background: none; color: var(--accent); text-decoration: underline; font-size: inherit; }
.bar { height: 4px; margin-top: 6px; background: var(--raised); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); transition: width .4s; }
.job .actions { margin-top: 6px; }
.empty { color: var(--muted); font-size: 13px; }

.tabs { display: flex; gap: 4px; }
.tabs button { padding: 6px 12px; border: 0; border-radius: 6px; background: none; color: var(--muted); }
.tabs button[aria-pressed="true"] { background: var(--raised); color: var(--text); }
.tabs b { margin-left: 5px; padding: 0 6px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: 12px; }
.fresh { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: -6px 0 14px; color: var(--muted); font-size: 13px; }
.fresh:empty { display: none; }
.portrait { position: relative; display: grid; place-items: center; aspect-ratio: 1; border-radius: 50%; overflow: hidden; background: var(--raised); color: var(--muted); font: italic 30px Georgia, serif; }
.portrait img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: none; border-radius: 0; }
.picks { display: grid; gap: 8px; }
.pick { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 14px; align-items: center; width: 100%; padding: 10px 12px; border: 1px solid transparent; border-radius: 10px; background: var(--panel); text-align: left; }
.pick:hover { border-color: var(--accent); }
.pick h3 { margin: 0; font-size: 16px; }
.pick .facts, .tags { margin-top: 3px; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tags span { padding: 0 7px; border-radius: 999px; background: var(--raised); color: var(--muted); font-size: 12px; }
.have { color: var(--good); font-size: 12px; margin-left: 8px; font-weight: 400; }
.page-head { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 20px; align-items: center; margin-bottom: 18px; }
.page-head h2 { margin: 0; font: italic 32px/1.15 Georgia, serif; overflow-wrap: anywhere; }
.back { margin-bottom: 12px; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 14px; }
.section-title { margin: 24px 0 10px; font: italic 20px Georgia, serif; }
#local .section-title { margin-top: 0; }
#local:not(:empty) { margin-bottom: 18px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
.tile { display: grid; gap: 7px; padding: 10px; border: 1px solid transparent; border-radius: 10px; background: var(--panel); text-align: center; }
.tile:hover { border-color: var(--accent); }
.tile strong { font-weight: 600; font-size: 14px; overflow-wrap: anywhere; }
.tile small { color: var(--muted); }
.wanted-list { display: grid; gap: 8px; }
.wanted-row { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px; background: var(--panel); border-radius: 10px; }
.wanted-row img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 5px; background: var(--raised); }
.wanted-row h3 { margin: 0; font-size: 15px; overflow-wrap: anywhere; }
.wanted-row .actions { margin: 0; }
.narrow-only { display: none; }
.tabs .narrow-only { display: none; }
.grip { width: 32px; height: 40px; padding: 0; border: 1px solid transparent; border-radius: 6px; background: none; color: var(--muted); font-size: 18px; line-height: 1; cursor: grab; touch-action: none; user-select: none; }
.grip:hover { border-color: var(--line); color: var(--text); }
.job.dragging { opacity: .75; background: var(--raised); border-radius: 8px; }
.job.dragging .grip { cursor: grabbing; }
.job.dragging { position: relative; z-index: 3; }
.job.drop-before { box-shadow: 0 -3px 0 var(--accent); }
.job.drop-after { box-shadow: 0 3px 0 var(--accent); }
.part-title { margin: 14px 0 0; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
.setting-note { margin: 0 0 10px; color: var(--muted); font-size: 13px; }
.release-title { overflow-wrap: anywhere; font-size: 14px; }
.releases { margin: 8px 0 0; padding: 0; list-style: none; }
.release { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 10px 0; border-top: 1px solid var(--line); }
.release.no .release-title { color: var(--muted); }
.downloads { margin-top: 20px; }
.downloads > h3, .group { margin: 0 0 4px; font: italic 20px Georgia, serif; }
.group { margin-top: 20px; }
.why { margin-top: 5px; font-size: 13px; color: var(--bad); }
.note { margin-top: 5px; font-size: 13px; color: var(--warn); }
.small-notice { margin-top: 18px; padding: 22px 16px; }
.field { display: grid; gap: 3px; margin-bottom: 10px; font-size: 13px; color: var(--muted); }
.field input { padding: 8px 10px; background: var(--ink); border: 1px solid var(--line); border-radius: 6px; color: var(--text); min-width: 0; }
.indexer { margin: 8px 0 12px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; }
.report { margin: 12px 0 0; padding: 0; list-style: none; font-size: 14px; }
.report .fine { color: var(--good); }
.report .bad { color: var(--bad); }

@media (max-width: 900px) {
  .top { padding: 16px 16px 0; align-items: center; flex-wrap: wrap; gap: 10px; }
  .health { margin-left: 0; justify-content: flex-start; flex-basis: 100%; }
  .layout { grid-template-columns: minmax(0, 1fr); padding: 14px 16px 32px; }
  .side { position: static; max-height: none; display: none; }
  .layout.show-queue .side { display: block; }
  .layout.show-queue main { display: none; }
  .tabs .narrow-only { display: inline-block; }
  .wide-only { display: none; }
  .tabs button { padding: 8px 10px; }
  .get, .small { min-height: 40px; padding: 8px 13px; }
  .find input, .field input { font-size: 16px; }
  .tiles { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
  .release { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .release .get { justify-self: start; }
  dialog { width: 100vw; max-width: 100vw; height: 100dvh; max-height: 100dvh; margin: 0; border: 0; border-radius: 0; }
  .close { position: sticky; top: 10px; float: right; margin: 10px 10px 0 0; z-index: 2; }
  .side h2 { font-size: 20px; }
  .grid { grid-template-columns: minmax(0, 1fr); }
  .album { grid-template-columns: 84px minmax(0, 1fr); }
  .detail { padding: 16px; }
  .detail-head { grid-template-columns: minmax(0, 1fr); }
  .detail-head img { max-width: 220px; }
  .page-head { grid-template-columns: 96px minmax(0, 1fr); gap: 14px; }
  .page-head h2 { font-size: 24px; }
  .wanted-row { grid-template-columns: 52px minmax(0, 1fr); }
  .wanted-row .actions { grid-column: 1 / -1; }
}
</style>
</head>
<body>
<header class="top">
  <h1 class="mark">Encore<span>.</span></h1>
  <nav class="tabs" id="tabs" aria-label="Sections">
    <button type="button" data-view="find" aria-pressed="true">Find</button>
    <button type="button" data-view="library" aria-pressed="false">Library</button>
    <button type="button" data-view="wanted" aria-pressed="false">Wanted</button>
    <button type="button" class="narrow-only" data-view="queue" aria-pressed="false">Queue</button>
  </nav>
  <div class="health" id="health" aria-live="polite"></div>
</header>
<div class="layout">
  <main>
    <form class="find" id="find">
      <div class="filters" role="group" aria-label="Search by">
        <button type="button" data-mode="albums" aria-pressed="true">Albums</button>
        <button type="button" data-mode="artist" aria-pressed="false">Artist</button>
      </div>
      <input id="query" type="search" placeholder="Artist or album" aria-label="Search for music" autocomplete="off" autofocus>
      <button class="primary">Search</button>
      <label class="hide-owned"><input type="checkbox" id="hideOwned"> Hide albums I have</label>
    </form>
    <section id="viewArtist" hidden></section>
    <section id="viewLibrary" hidden></section>
    <section id="viewWanted" hidden></section>
    <section id="viewFind">
    <div id="local"></div>
    <div class="fresh" id="fresh"></div>
    <p class="hidden-count" id="hiddenCount" aria-live="polite"></p>
    <div id="results"><div class="notice"><strong>What's next?</strong>Search your library and everywhere else from the box above.</div></div>
    </section>
  </main>
  <aside class="side">
    <div class="side-head">
      <h2>Queue</h2>
      <button class="small" id="clearDone" hidden>Clear finished</button>
    </div>
    <label class="setting"><input type="checkbox" id="fix"> Use the album artist on every track, except compilations</label>
    <div class="jobs" id="jobs" aria-live="polite"></div>
  </aside>
</div>
<dialog id="detail" aria-label="Album details"></dialog>
<dialog id="settings" aria-label="Settings"></dialog>
<script>
const $ = id => document.getElementById(id);
let albums = [], jobs = [], searched = false, confirming = null;
let mode = 'albums', detail = null, view = 'find', cameFrom = 'find';
let dragging = false, videos = null, page = null, studioOnly = true, wantAll = false, shelf = null, wanted = [];

const ago = time => {
  const seconds = Date.now() / 1000 - time;
  if (seconds < 90) return 'just now';
  if (seconds < 5400) return `${Math.round(seconds / 60)} minutes ago`;
  if (seconds < 129600) return `${Math.round(seconds / 3600)} hours ago`;
  return `${Math.round(seconds / 86400)} days ago`;
};

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (key === 'class') node.className = value;
    else if (key === 'onclick') node.onclick = value;
    else if (key === 'onerror') node.onerror = value;
    else if (value !== undefined && value !== false) node.setAttribute(key, value);
  }
  node.append(...children.filter(c => c !== null && c !== undefined));
  return node;
}

async function api(path, options = {}) {
  const res = await fetch(path, { ...options, headers: { 'X-Encore': '1', 'Content-Type': 'application/json' } });
  if (res.status === 401 && path !== '/api/login') {
    location.href = '/login';
    throw new Error('Sign in first');
  }
  if (!res.ok) {
    let text = await res.text();
    try { text = JSON.parse(text).error || text; } catch {}
    throw new Error(text || 'Request failed');
  }
  return res.json();
}

const stored = key => { try { return localStorage.getItem(key); } catch { return null; } };
const store = (key, value) => { try { localStorage.setItem(key, value); } catch {} };
$('fix').checked = stored('encore-fix') !== '0';
$('fix').onchange = () => store('encore-fix', $('fix').checked ? '1' : '0');
$('hideOwned').checked = stored('encore-hide-owned') === '1';
$('hideOwned').onchange = () => {
  store('encore-hide-owned', $('hideOwned').checked ? '1' : '0');
  renderAll();
};

const noCover = event => { event.target.style.visibility = 'hidden'; };
const cover = src => el('img', { src, alt: '', loading: 'lazy', onerror: noCover });
const portrait = (src, name) => el('div', { class: 'portrait' }, (name || '?').slice(0, 1).toUpperCase(), el('img', { src, alt: '', loading: 'lazy', onerror: noCover }));
const photoUrl = (artist, version = '') => `/api/artist/${artist.id}/photo?best=${artist.best === false ? 0 : 1}&v=${version}`;
const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;

function activeJob(id) {
  return jobs.find(j => j.album_id === id && ['queued', 'downloading', 'verifying', 'filing', 'scanning', 'done'].includes(j.state));
}

function ownedNote(album) {
  const owned = album.owned;
  if (!owned) return null;
  const have = owned.quality ? ` at ${owned.quality}` : '';
  return el('div', { class: 'owned' }, `${owned.match === 'exact' ? 'You have this' : 'Possible match'}${have}: ${owned.folder}`);
}

function albumAction(album) {
  const job = activeJob(album.id);
  if (job) return el('button', { class: 'get', disabled: true }, job.state !== 'done' ? 'In the queue' : job.where === 'library' ? 'In your library' : 'In MusicImport');
  return el('button', { class: 'get main', onclick: () => openAlbum(album) }, 'Find downloads');
}

function wantButton(album) {
  if (activeJob(album.id) || (album.owned && album.owned.match === 'exact')) return null;
  return el('button', { class: 'get', 'aria-pressed': album.wanted ? 'true' : 'false', onclick: () => toggleWanted(album) }, album.wanted ? 'Wanted ✓' : 'Add to Wanted');
}

function markWanted(ids, value) {
  const lists = [albums, page ? page.albums : [], detail && detail.data ? [detail.data] : [], detail ? [detail.summary] : []];
  for (const list of lists) for (const album of list) if (ids.includes(album.id)) album.wanted = value;
}

async function toggleWanted(album) {
  const adding = !album.wanted;
  try {
    if (adding) await api('/api/wanted', { method: 'POST', body: JSON.stringify({ album_ids: [album.id] }) });
    else await api(`/api/wanted/${album.id}`, { method: 'DELETE' });
    markWanted([album.id], adding);
    await loadWanted();
    renderAll();
  } catch (error) { alert(error.message); }
}

function albumCard(album) {
  return el('article', { class: 'album' },
    el('button', { class: 'open', 'aria-label': `Open ${album.title}`, onclick: () => openAlbum(album) }, cover(album.cover)),
    el('div', {},
      el('button', { class: 'open', onclick: () => openAlbum(album) }, el('h3', {}, album.title)),
      el('div', { class: 'by' }, [album.artist, album.year].filter(Boolean).join(' · ')),
      el('div', { class: 'meta' }, album.kind),
      ownedNote(album),
      el('div', { class: 'actions' }, albumAction(album), wantButton(album))));
}

function clock(seconds) {
  const hours = Math.floor(seconds / 3600), minutes = Math.floor(seconds / 60) % 60, rest = String(seconds % 60).padStart(2, '0');
  return hours ? `${hours}:${String(minutes).padStart(2, '0')}:${rest}` : `${minutes}:${rest}`;
}

function trackRows(album) {
  const rows = [];
  let disc = null;
  for (const track of album.tracks_list) {
    if (album.discs > 1 && track.disc !== disc) {
      disc = track.disc;
      rows.push(el('li', { class: 'disc', style: 'display:block;border:0' }, `Disc ${disc}`));
    }
    const guest = track.artist && track.artist !== album.artist ? el('small', {}, track.artist) : null;
    rows.push(el('li', {},
      el('span', { class: 'num' }, track.number),
      el('span', {}, track.title, guest),
      el('span', { class: 'time' }, track.seconds ? clock(track.seconds) : '')));
  }
  return el('ol', { class: 'tracks' }, ...rows);
}

function sizeText(bytes) {
  return bytes >= 1e9 ? `${(bytes / 1e9).toFixed(1)} GB` : `${Math.round(bytes / 1e6)} MB`;
}

function ageText(posted) {
  if (!posted) return '';
  const days = Math.floor((Date.now() / 1000 - posted) / 86400);
  return days >= 365 ? `${(days / 365).toFixed(1)} years old` : `${plural(days, 'day')} old`;
}

function releaseButton(album, row, label) {
  const queued = activeJob(album.id);
  if (queued) return el('button', { class: 'get', disabled: true }, queued.state === 'done' ? 'Done' : 'In the queue');
  if (album.owned && confirming !== row.key) {
    return el('button', { class: 'get', onclick: () => { confirming = row.key; renderDetail(); } }, 'Get anyway');
  }
  return el('button', { class: `get ${row.tier === 'no' ? '' : 'main'}`, onclick: () => getRelease(album, row) }, album.owned ? 'Yes, get it' : label);
}

function releaseRow(album, row, best) {
  const facts = [sizeText(row.size), row.indexer, ageText(row.posted)].filter(Boolean).join(' · ');
  const notes = [...row.notes];
  if (row.failed) notes.unshift(`Failed last time: ${row.failed}`);
  return el('li', { class: `release ${row.tier}` },
    el('div', { class: 'release-body' },
      el('div', { class: 'release-title' }, row.title),
      el('div', { class: 'meta' },
        best ? el('span', { class: 'quality top-tier' }, 'Best match') : null,
        row.quality ? el('span', { class: 'quality' }, row.quality) : null, facts),
      notes.length ? el('div', { class: row.tier === 'no' || row.failed ? 'why' : 'note' }, notes.join('. ') + '.') : null),
    releaseButton(album, row, row.tier === 'no' ? 'Get anyway' : 'Get'));
}

function downloadsBlock(album) {
  const found = detail.downloads;
  if (detail.downloadError) return el('div', { class: 'notice error small-notice' }, detail.downloadError);
  if (!found) return el('div', { class: 'notice small-notice' }, 'Searching your indexers…');
  const usable = found.results.filter(r => r.tier !== 'no'), other = found.results.filter(r => r.tier === 'no');
  const parts = found.problems.map(text => el('div', { class: 'why' }, `${text}.`));
  if (usable.length) parts.push(el('ul', { class: 'releases' }, ...usable.map((row, i) => releaseRow(album, row, i === 0 && !row.failed))));
  else parts.push(el('div', { class: 'notice small-notice' }, found.results.length ? 'Nothing here looks like the whole album in FLAC.' : 'Neither indexer has this album.'));
  if (other.length) {
    parts.push(el('details', { class: 'about', open: !usable.length },
      el('summary', {}, `${plural(other.length, 'other result')} left out`),
      el('ul', { class: 'releases' }, ...other.map(row => releaseRow(album, row, false)))));
  }
  return el('section', { class: 'downloads' }, el('h3', {}, 'Downloads'), ...parts);
}

function renderDetail() {
  if (!detail) return;
  const album = detail.data || detail.summary;
  const facts = [album.released || album.year, album.label, album.kind, album.discs > 1 ? plural(album.discs, 'disc') : ''].filter(Boolean).join(' · ');
  const summary = album.tracks ? `${plural(album.tracks, 'track')} · ${album.minutes} min` : '';
  const body = [el('div', { class: 'detail-head' },
    el('img', { src: album.cover, alt: '', onerror: noCover }),
    el('div', {},
      el('h2', {}, album.title),
      el('div', { class: 'by' }, album.artist),
      summary ? el('div', { class: 'meta' }, summary) : null,
      facts ? el('div', { class: 'facts' }, facts) : null,
      album.editions > 1 ? el('div', { class: 'facts' }, `${album.editions} editions are known, and a download can fit any of them.`) : null,
      ownedNote(album),
      el('div', { class: 'actions' }, wantButton(album),
        album.saved_at ? el('button', { class: 'small', onclick: () => openAlbum(album, true) }, 'Refresh tracks') : null),
      album.saved_at ? el('div', { class: 'facts' }, `Saved ${ago(album.saved_at)}`) : null))];
  if (detail.error) body.push(el('div', { class: 'notice error small-notice' }, detail.error));
  else if (!detail.data) body.push(el('div', { class: 'notice small-notice' }, 'Loading tracks…'));
  else {
    body.push(downloadsBlock(album));
    body.push(trackRows(album));
  }
  $('detail').replaceChildren(
    el('button', { class: 'close', 'aria-label': 'Close', onclick: () => $('detail').close() }, '×'),
    el('div', { class: 'detail' }, ...body));
}

async function openAlbum(album, refresh = false) {
  detail = { summary: album };
  confirming = null;
  const opened = detail;
  renderDetail();
  if (!$('detail').open) $('detail').showModal();
  $('detail').scrollTop = 0;
  try {
    opened.data = await api(`/api/album/${album.id}${refresh ? '?refresh=1' : ''}`);
  } catch (error) {
    opened.error = error.message;
  }
  if (detail === opened) renderDetail();
  if (opened.error) return;
  try {
    opened.downloads = await api(`/api/album/${album.id}/downloads`);
  } catch (error) {

$('detail').onclose = () => { detail = null; };
for (const name of ['detail', 'settings']) {
  $(name).onclick = event => { if (event.target === $(name)) $(name).close(); };
}

function renderResults() {
  const box = $('results');
  if (!searched) return;
  const hide = $('hideOwned').checked;
  const shown = albums.filter(a => !(hide && a.owned && a.owned.match === 'exact'));
  const hidden = albums.length - shown.length;
  $('hiddenCount').textContent = hidden && shown.length ? `${plural(hidden, 'album')} you have hidden` : '';
  if (!shown.length) {
    const empty = hidden ? `You already have ${hidden === 1 ? 'this album' : `all ${hidden} of these`}.` : 'No albums found.';
    box.replaceChildren(el('div', { class: 'notice' }, empty));
    return;
  }
  box.replaceChildren(el('div', { class: 'grid' }, ...shown.map(albumCard)));
}

const stateText = {
  queued: 'Waiting', downloading: 'Downloading', verifying: 'Checking every track',
  filing: 'Filing the album', scanning: 'Plex is scanning',
};

function jobCard(job) {
  const running = ['downloading', 'verifying', 'filing', 'scanning'].includes(job.state);
  const percent = job.state === 'downloading' ? job.percent : 100;
  let state = ['failed', 'done'].includes(job.state) ? job.message : stateText[job.state];
  if (job.state === 'downloading') state = job.step ? `SABnzbd: ${job.step}` : `Downloading ${Math.round(job.percent)}%`;
  if (job.state === 'done' && job.quality) state += ` · ${job.quality}`;
  const buttons = [];
  if (job.state === 'failed') {
    if (job.kind !== 'video') buttons.push(el('button', { class: 'small', onclick: () => openAlbum({ id: job.album_id, title: job.title, artist: job.artist, year: job.year, cover: job.cover }) }, 'Pick another'));
    buttons.push(el('button', { class: 'small', onclick: () => act(`/api/queue/${job.id}/retry`, 'POST') }, 'Retry'));
  }
  if (job.state === 'failed' && (job.can_import || job.message.startsWith('Not all FLAC'))) {
    buttons.push(el('button', { class: 'small', onclick: () => act(`/api/queue/${job.id}/import`, 'POST') }, 'Import anyway'));
  }
  if (job.state === 'failed' && job.can_partial) buttons.push(el('button', { class: 'small', onclick: () => act(`/api/queue/${job.id}/partial`, 'POST') }, 'Get the rest'));
  if (!['filing', 'scanning'].includes(job.state)) {
    buttons.push(el('button', { class: 'small', onclick: () => act(`/api/queue/${job.id}`, 'DELETE') },
      running ? 'Cancel' : job.state === 'queued' ? 'Remove' : 'Clear'));
  }
  const grip = job.state === 'queued' ? el('button', { type: 'button', class: 'grip', title: 'Drag to reorder',
    'aria-label': `Move ${job.title}. Use the up and down arrow keys.` }, '⠿') : null;
  if (grip) {
    grip.onpointerdown = event => startDrag(event, grip);
    grip.onkeydown = event => nudge(event, grip);
  }
  return el('div', { class: `job ${job.state} ${job.where || ''}`, 'data-job': job.id },
    cover(job.cover),
    el('div', {},
      el('b', {}, `${job.artist} – ${job.title}`),
      el('div', { class: 'state' }, state),
      running ? el('div', { class: 'bar' }, el('i', { style: `width:${percent}%` })) : null,
      el('div', { class: 'actions' }, ...buttons)),
    grip);
}

function startDrag(event, grip) {
  event.preventDefault();
  const card = grip.closest('.job'), box = $('jobs');
  const startY = event.clientY;
  const others = [...box.querySelectorAll('.job.queued')].filter(other => other !== card);
  let target = null;
  const mark = (node, name) => { others.forEach(o => o.classList.remove('drop-before', 'drop-after')); if (node) node.classList.add(name); };
  dragging = true;
  card.classList.add('dragging');
  grip.setPointerCapture(event.pointerId);
  grip.onpointermove = move => {
    card.style.transform = `translateY(${move.clientY - startY}px)`;
    target = others.find(other => {
      const rect = other.getBoundingClientRect();
      return move.clientY < rect.top + rect.height / 2;
    }) || null;
    if (target) mark(target, 'drop-before');
    else if (others.length) mark(others[others.length - 1], 'drop-after');
  };
  const finish = keep => {
    grip.onpointermove = grip.onpointerup = grip.onpointercancel = null;
    mark(null);
    card.classList.remove('dragging');
    card.style.transform = '';
    dragging = false;
    if (!keep) return renderJobs();
    if (target) box.insertBefore(card, target);
    else if (others.length) others[others.length - 1].after(card);
    saveOrder();
  };
  grip.onpointerup = () => finish(true);
  grip.onpointercancel = () => finish(false);
}

function nudge(event, grip) {
  if (!['ArrowUp', 'ArrowDown'].includes(event.key)) return;
  event.preventDefault();
  const card = grip.closest('.job');
  const queued = [...$('jobs').querySelectorAll('.job.queued')];
  const place = queued.indexOf(card) + (event.key === 'ArrowUp' ? -1 : 1);
  if (place < 0 || place >= queued.length) return;
  if (event.key === 'ArrowUp') queued[place].before(card); else queued[place].after(card);
  saveOrder(card.dataset.job);
}

async function saveOrder(focus) {
  const ids = [...$('jobs').querySelectorAll('.job.queued')].map(card => card.dataset.job);
  const rest = jobs.filter(job => !ids.includes(job.id));
  jobs = [...rest, ...ids.map(id => jobs.find(job => job.id === id)).filter(Boolean)];
  renderJobs();
  if (focus) $('jobs').querySelector(`[data-job="${focus}"] .grip`)?.focus();
  try { await api('/api/queue/order', { method: 'POST', body: JSON.stringify({ ids }) }); } catch (error) { alert(error.message); }
  refreshJobs();
}

const isRunning = job => ['downloading', 'verifying', 'filing', 'scanning'].includes(job.state);

function renderJobs() {
  if (dragging) return;
  const running = jobs.filter(isRunning), waiting = jobs.filter(j => j.state === 'queued');
  const finished = jobs.filter(j => ['failed', 'done'].includes(j.state)).reverse();
  const part = text => el('h3', { class: 'part-title' }, text);
  $('clearDone').hidden = !jobs.some(j => j.state === 'done');
  const tab = document.querySelector('[data-view="queue"]');
  const busy = running.length + waiting.length;
  tab.replaceChildren('Queue', ...(busy ? [el('b', {}, busy)] : []));
  if (!jobs.length) return $('jobs').replaceChildren(el('div', { class: 'empty' }, 'Nothing queued yet.'));
  $('jobs').replaceChildren(
    ...(running.length ? [part('Now'), ...running.map(jobCard)] : []),
    ...(waiting.length ? [part('Up next'), ...waiting.map(jobCard)] : []),
    ...(finished.length ? [part('Finished'), ...finished.map(jobCard)] : []));
}

async function refreshJobs() {
  if (dragging) return;
  try {
    const next = (await api('/api/queue')).jobs;
    if (dragging) return;
    const changed = JSON.stringify(next) !== JSON.stringify(jobs);
    jobs = next;
    if (changed) { renderJobs(); renderAll(); }
  } catch {}
}

async function act(path, method) {
  try { await api(path, { method }); } catch (error) { alert(error.message); }
  refreshJobs();
}

async function getRelease(album, row) {
  confirming = null;
  try {
    await api('/api/queue', { method: 'POST', body: JSON.stringify({ album_id: album.id, release: row.key, fix_artist: $('fix').checked }) });
  } catch (error) { alert(error.message); }
  await refreshJobs();
  await loadWanted();
  renderAll();
}

async function refreshHealth() {
  const box = $('health');
  const gear = el('button', { class: 'link', onclick: openSettings }, 'Settings');
  try {
    const s = await api('/api/status');
    setWantedCount(s.wanted);
    box.replaceChildren(
      ...(s.folders ? [] : [el('span', { class: 'down' }, el('i', { class: 'dot' }), 'Folders not set')]),
      s.indexers ? el('span', { class: 'ok' }, el('i', { class: 'dot' }), plural(s.indexers, 'indexer'))
        : el('span', { class: 'down' }, el('i', { class: 'dot' }), 'No indexers set up'),
      s.sab === 'ok' ? el('span', { class: 'ok' }, el('i', { class: 'dot' }), 'SABnzbd connected')
        : el('span', { class: 'down' }, el('i', { class: 'dot' }), s.sab === 'unset' ? 'SABnzbd not set up' : "Can't reach SABnzbd"),
      s.plex === 'ok' ? el('span', { class: 'ok' }, el('i', { class: 'dot' }), 'Plex connected')
        : s.plex === 'error' ? el('span', { class: 'down' }, el('i', { class: 'dot' }), "Can't reach Plex")
        : s.plex === 'unset' ? el('span', {}, el('i', { class: 'dot' }), 'Plex not set up')
        : el('button', { class: 'link', onclick: connectPlex }, 'Connect Plex'),
      el('span', { class: 'wide-only' }, `${s.albums} album folders in library`),
      el('span', { class: 'wide-only' }, `${(s.free / 1024 ** 4).toFixed(1)} TB free`),
      gear);
  } catch {
    box.replaceChildren(el('span', { class: 'down' }, el('i', { class: 'dot' }), "Can't reach Encore"), gear);
  }
}

async function connectPlex() {
  const tab = window.open('', '_blank');
  try {
    const pin = await api('/api/plex/link', { method: 'POST' });
    tab.location = pin.url;
    for (let i = 0; i < 150; i++) {
      await new Promise(done => setTimeout(done, 2000));
      if ((await api(`/api/plex/link/${pin.id}`)).linked) break;
    }
    refreshHealth();
  } catch (error) {
    tab.close();
    alert(error.message);
  }
}

function field(label, attrs) {
  const input = el('input', { autocomplete: 'off', ...attrs });
  return [el('label', { class: 'field' }, el('span', {}, label), input), input];
}

function keyField(label, hasKey) {
  return field(label, { type: 'password', placeholder: hasKey ? 'Saved. Leave blank to keep it' : 'Paste the API key' });
}

function indexerRow(indexer, rows) {
  const [nameBox, name] = field('Name', { value: indexer.name });
  const [urlBox, url] = field('Address', { value: indexer.url });
  const [keyBox, key] = keyField('API key', indexer.has_key);
  const row = { name, url, key };
  rows.push(row);
  const node = el('fieldset', { class: 'indexer' }, nameBox, urlBox, keyBox,
    el('button', { type: 'button', class: 'small', onclick: () => { rows.splice(rows.indexOf(row), 1); node.remove(); } }, 'Remove'));
  return node;
}

function passwordBlock(on, report) {
  const [currentBox, current] = field('Current password', { type: 'password', autocomplete: 'current-password' });
  const [newBox, fresh] = field(on ? 'New password' : 'Password', { type: 'password', autocomplete: 'new-password' });
  const send = async (next, done) => {
    try {
      await api('/api/password', { method: 'POST', body: JSON.stringify({ current: current.value, new: next }) });
      await openSettings();
      $('settingsReport').replaceChildren(el('li', { class: 'fine' }, done));
    } catch (error) { report.replaceChildren(el('li', { class: 'bad' }, error.message)); }
  };
  const signOut = async () => {
    await api('/api/logout', { method: 'POST' });
    location.href = '/login';
  };
  if (!on) {
    return [el('p', { class: 'setting-note' }, 'Encore is open to anyone on your network. Set a password to show a sign-in screen first.'), newBox,
      el('div', { class: 'actions' }, el('button', { type: 'button', class: 'small', onclick: () => send(fresh.value, 'Password is on.') }, 'Turn on password'))];
  }
  return [el('p', { class: 'setting-note' }, 'A password is on. Signing in lasts 30 days on each device.'), currentBox, newBox,
    el('div', { class: 'actions' },
      el('button', { type: 'button', class: 'small', onclick: () => { if (fresh.value) send(fresh.value, 'Password changed.'); } }, 'Change password'),
      el('button', { type: 'button', class: 'small', onclick: () => send('', 'Password is off.') }, 'Remove password'),
      el('button', { type: 'button', class: 'small', onclick: signOut }, 'Sign out'))];
}

async function openSettings() {
  const current = await api('/api/settings');
  const rows = [];
  const list = el('div', {}, ...current.indexers.map(i => indexerRow(i, rows)));
  const [sabUrlBox, sabUrl] = field('Address', { value: current.sab.url, placeholder: 'http://sabnzbd:8080' });
  const [plexBox, plexUrl] = field('Address', { value: current.plex.url, placeholder: 'http://plex:32400' });
  const [musicBox, music] = field('Music library', { value: current.folders.music, placeholder: '/mnt/media/Music' });
  const [importBox, imports] = field('Import folder, for albums that need you to file them', { value: current.folders.imports, placeholder: '/mnt/media/MusicImport' });
  const [downloadBox, downloads] = field('Downloads. SABnzbd must see this same path', { value: current.folders.downloads, placeholder: '/mnt/media/Downloads/Encore' });
  const [sabKeyBox, sabKey] = keyField('API key', current.sab.has_key);
  const report = el('ul', { class: 'report', id: 'settingsReport', 'aria-live': 'polite' });
  const save = async () => {
    await api('/api/settings', { method: 'POST', body: JSON.stringify({
      indexers: rows.map(r => ({ name: r.name.value, url: r.url.value, key: r.key.value })),
      sab: { url: sabUrl.value, key: sabKey.value }, plex: { url: plexUrl.value },
      folders: { music: music.value, imports: imports.value, downloads: downloads.value } }) });
    refreshHealth();
  };
  const run = async action => {
    try { await action(); } catch (error) { report.replaceChildren(el('li', { class: 'bad' }, error.message)); }
  };
  const test = async () => {
    await save();
    report.replaceChildren(el('li', {}, 'Testing…'));
    const { results } = await api('/api/settings/test', { method: 'POST' });
    report.replaceChildren(...results.map(r => el('li', { class: r.ok ? 'fine' : 'bad' }, `${r.name}: ${r.text}`)));
  };
  $('settings').replaceChildren(
    el('button', { class: 'close', 'aria-label': 'Close', onclick: () => $('settings').close() }, '×'),
    el('div', { class: 'detail' },
      el('h2', {}, 'Settings'),
      el('h3', { class: 'group' }, 'Indexers'), list,
      el('button', { type: 'button', class: 'small', onclick: () => list.append(indexerRow({ name: '', url: 'https://', has_key: false }, rows)) }, 'Add an indexer'),
      el('h3', { class: 'group' }, 'SABnzbd'), sabUrlBox, sabKeyBox,
      el('h3', { class: 'group' }, 'Plex'), plexBox,
      el('h3', { class: 'group' }, 'Folders'), musicBox, importBox, downloadBox,
      el('div', { class: 'actions' },
        el('button', { type: 'button', class: 'primary', onclick: () => run(test) }, 'Save and test')),
      el('h3', { class: 'group' }, 'Password'), ...passwordBlock(current.password, report),
      report));
  if (!$('settings').open) $('settings').showModal();
}

function renderAll() {
  renderResults();
  renderArtistPage();
  renderDetail();
  if (view === 'wanted') renderWanted();
}

function show(next) {
  view = next;
  $('viewFind').hidden = next !== 'find';
  $('viewArtist').hidden = next !== 'artist';
  $('viewLibrary').hidden = next !== 'library';
  $('viewWanted').hidden = next !== 'wanted';
  document.querySelector('.layout').classList.toggle('show-queue', next === 'queue');
  const tab = next === 'artist' ? cameFrom : next;
  document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === tab));
}

document.querySelectorAll('[data-view]').forEach(button => {
  button.onclick = () => {
    show(button.dataset.view);
    if (view === 'library') loadLibrary();
    if (view === 'wanted') loadWanted();
  };
});

const narrow = matchMedia('(max-width: 900px)');
narrow.onchange = () => { if (!narrow.matches && view === 'queue') show('find'); };

function setWantedCount(count) {
  const tab = document.querySelector('[data-view="wanted"]');
  tab.replaceChildren('Wanted', ...(count ? [el('b', {}, count)] : []));
}

function freshness(saved, refresh, label = 'Refresh') {
  return [saved ? `Saved ${ago(saved)}` : '', el('button', { class: 'small', onclick: refresh }, label)];
}

function artistFacts(artist) {
  const span = artist.begin ? `${artist.begin}–${artist.end || (artist.ended ? '' : 'now')}` : '';
  return [artist.kind, artist.country, span, artist.note].filter(Boolean).join(' · ');
}

function tagList(artist) {
  return artist.tags && artist.tags.length ? el('div', { class: 'tags' }, ...artist.tags.map(tag => el('span', {}, tag))) : null;
}

function artistPick(artist) {
  return el('button', { type: 'button', class: 'pick', onclick: () => openArtistPage(artist.id, false, artist.best) },
    portrait(photoUrl(artist), artist.name),
    el('div', {},
      el('h3', {}, artist.name, artist.in_library ? el('span', { class: 'have' }, 'In your library') : null),
      el('div', { class: 'facts' }, artistFacts(artist)),
      tagList(artist)));
}

async function openArtistPage(id, refresh = false, best = true) {
  if (view !== 'artist') cameFrom = view;
  page = { id, loading: true, best };
  wantAll = false;
  show('artist');
  renderArtistPage();
  scrollTo(0, 0);
  try {
    const data = await api(`/api/artist/${id}${refresh ? '?refresh=1' : ''}`);
    if (page.id !== id) return;
    page = { ...data, id, best };
    page.artist.best = best;
  } catch (error) {
    if (page.id === id) page = { id, best, error: error.message };
  }
  renderArtistPage();
}

function renderArtistPage() {
  if (!page || view !== 'artist') return;
  const back = el('button', { class: 'small back', onclick: () => { show(cameFrom); if (view === 'library') loadLibrary(); } }, '← Back');
  if (page.loading) return $('viewArtist').replaceChildren(back, el('div', { class: 'notice' }, 'Loading albums. The first visit to an artist takes a moment.'));
  if (page.error) return $('viewArtist').replaceChildren(back, el('div', { class: 'notice error' }, page.error));
  const { artist } = page;
  const chosen = page.albums.filter(a => !studioOnly || a.kind === 'Album');
  const have = chosen.filter(a => a.owned && a.owned.match === 'exact').length;
  const hide = $('hideOwned').checked;
  const shown = chosen.filter(a => !(hide && a.owned && a.owned.match === 'exact'));
  const missing = chosen.filter(a => !a.owned && !a.wanted && !activeJob(a.id));
  const filter = (label, value) => el('button', { type: 'button', 'aria-pressed': studioOnly === value ? 'true' : 'false',
    onclick: () => { studioOnly = value; wantAll = false; renderArtistPage(); } }, label);
  const want = missing.length ? el('button', { class: `small${wantAll ? ' get main' : ''}`, onclick: () => addAllMissing(missing) },
    wantAll ? `Yes, add ${plural(missing.length, 'album')}` : `Add ${missing.length} missing to Wanted`) : null;
  const sections = [back,
    el('div', { class: 'page-head' },
      portrait(photoUrl(artist, Math.round(page.saved_at)), artist.name),
      el('div', {},
        el('h2', {}, artist.name),
        el('div', { class: 'facts' }, artistFacts(artist)),
        tagList(artist),
        el('div', { class: 'facts' }, `You have ${have} of ${plural(chosen.length, 'album')} here`))),
    el('div', { class: 'toolbar' },
      el('div', { class: 'filters', role: 'group', 'aria-label': 'Show' }, filter('Studio albums', true), filter('Everything', false)),
      want,
      el('span', { class: 'fresh', style: 'margin:0' }, ...freshness(page.saved_at, () => openArtistPage(page.id, true, page.best)))),
    shown.length ? el('div', { class: 'grid' }, ...shown.map(albumCard))
      : el('div', { class: 'notice' }, chosen.length ? 'You have all of these.' : 'No albums here. Try Everything.')];
  sections.push(el('h3', { class: 'section-title' }, 'Videos'), videoBlock());
  if (page.others.length) {
    sections.push(el('h3', { class: 'section-title' }, 'Also in your library'),
      el('div', { class: 'grid' }, ...page.others.map(album => el('article', { class: 'album' }, cover(album.cover),
        el('div', {}, el('h3', {}, album.title), el('div', { class: 'by' }, album.year || ''))))));
  }
  $('viewArtist').replaceChildren(...sections);
}

function videoRow(row) {
  const job = activeJob(`video-${row.key}`);
  const facts = [sizeText(row.size), row.indexer, ageText(row.posted)].filter(Boolean).join(' · ');
  const notes = [...row.notes];
  if (row.failed) notes.unshift(`Failed last time: ${row.failed}`);
  return el('li', { class: `release ${row.tier}` },
    el('div', { class: 'release-body' },
      el('div', { class: 'release-title' }, el('b', {}, row.song || 'Unknown song')),
      el('div', { class: 'meta' }, el('span', { class: 'quality' }, row.quality), facts),
      el('div', { class: 'facts' }, row.title),
      notes.length ? el('div', { class: row.tier === 'no' || row.failed ? 'why' : 'note' }, notes.join('. ') + '.') : null),
    job ? el('button', { class: 'get', disabled: true }, job.state === 'done' ? 'Done' : 'In the queue')
      : el('button', { class: `get ${row.tier === 'no' ? '' : 'main'}`, disabled: !row.song, onclick: () => getVideo(row) }, row.tier === 'no' ? 'Get anyway' : 'Get'));
}

function videoBlock() {
  if (!videos || videos.id !== page.id) return el('button', { class: 'small', onclick: () => findVideos() }, 'Find videos');
  if (videos.loading) return el('div', { class: 'notice small-notice' }, 'Searching your indexers…');
  if (videos.error) return el('div', { class: 'notice error small-notice' }, videos.error);
  const usable = videos.results.filter(r => r.tier !== 'no'), other = videos.results.filter(r => r.tier === 'no');
  const parts = videos.problems.map(text => el('div', { class: 'why' }, `${text}.`));
  if (usable.length) parts.push(el('ul', { class: 'releases' }, ...usable.map(videoRow)));
  else parts.push(el('div', { class: 'notice small-notice' }, 'No usable videos found for this artist.'));
  if (other.length) {
    parts.push(el('details', { class: 'about' }, el('summary', {}, `${plural(other.length, 'other result')} left out`),
      el('ul', { class: 'releases' }, ...other.map(videoRow))));
  }
  return el('div', {}, ...parts);
}

async function findVideos() {
  const id = page.id;
  videos = { id, loading: true };
  renderArtistPage();
  try {
    videos = { id, ...(await api(`/api/artist/${id}/videos`)) };
  } catch (error) {
    videos = { id, error: error.message };
  }
  renderArtistPage();
}

async function getVideo(row) {
  try {
    await api('/api/videos', { method: 'POST', body: JSON.stringify({ artist_id: page.id, release: row.key, song: row.song }) });
  } catch (error) { alert(error.message); }
  await refreshJobs();
  renderArtistPage();
}

async function addAllMissing(missing) {
  if (!wantAll) { wantAll = true; return renderArtistPage(); }
  wantAll = false;
  const ids = missing.map(a => a.id);
  try {
    await api('/api/wanted', { method: 'POST', body: JSON.stringify({ album_ids: ids }) });
    markWanted(ids, true);
    await loadWanted();
  } catch (error) { alert(error.message); }
  renderArtistPage();
}

async function loadLibrary(sync = false) {
  if (!shelf) $('viewLibrary').replaceChildren(el('div', { class: 'notice' }, 'Loading your library…'));
  try {
    shelf = await api('/api/library' + (sync ? '/sync' : ''), { method: sync ? 'POST' : 'GET' });
    renderLibrary();
    renderLocal();
  } catch (error) {
    $('viewLibrary').replaceChildren(el('div', { class: 'notice error' }, error.message));
  }
}

function libraryTile(artist) {
  const open = () => artist.id ? openArtistPage(artist.id) : searchFor(artist.name);
  return el('button', { type: 'button', class: 'tile', onclick: open },
    portrait(`/api/plex/thumb/${artist.rating}`, artist.name),
    el('strong', {}, artist.name), el('small', {}, plural(artist.albums, 'album')));
}

const plainText = text => text.normalize('NFD').replace(/\p{M}/gu, '').toLowerCase();

function libraryMatches() {
  const words = plainText($('query').value.trim());
  return words && shelf ? shelf.artists.filter(a => plainText(a.name).includes(words)) : [];
}

function renderLocal() {
  const found = libraryMatches();
  $('local').replaceChildren(...(found.length ? [el('h3', { class: 'section-title' }, 'In your library'),
    el('div', { class: 'tiles' }, ...found.slice(0, 12).map(libraryTile))] : []));
  return found;
}

function renderLibrary() {
  if (!shelf.artists.length) {
    return $('viewLibrary').replaceChildren(el('div', { class: 'notice' }, 'Nothing from Plex yet. Connect Plex at the top of the page, then sync.'),
      el('div', { class: 'toolbar', style: 'margin-top:12px' }, el('button', { class: 'small', onclick: () => loadLibrary(true) }, 'Sync with Plex')));
  }
  const tiles = el('div', { class: 'tiles' }, ...shelf.artists.map(libraryTile));
  $('viewLibrary').replaceChildren(
    el('div', { class: 'toolbar' },
      `${plural(shelf.artists.length, 'artist')} · ${plural(shelf.albums, 'album')}`,
      el('span', { class: 'fresh', style: 'margin:0' }, ...freshness(shelf.saved_at, () => loadLibrary(true), 'Sync with Plex'))),
    tiles);
}

async function loadWanted() {
  try {
    wanted = (await api('/api/wanted')).albums;
    setWantedCount(wanted.length);
    if (view === 'wanted') renderWanted();
  } catch (error) {
    if (view === 'wanted') $('viewWanted').replaceChildren(el('div', { class: 'notice error' }, error.message));
  }
}

function wantedRow(album) {
  const job = activeJob(album.id);
  return el('article', { class: 'wanted-row' },
    cover(album.cover),
    el('div', {},
      el('button', { class: 'open', onclick: () => openAlbum(album) }, el('h3', {}, album.title)),
      el('div', { class: 'by' }, [album.artist, album.year].filter(Boolean).join(' · ')),
      el('div', { class: 'facts' }, job ? 'In the queue' : `Added ${ago(album.added)}`)),
    el('div', { class: 'actions' },
      el('button', { class: 'get main', disabled: !!job, onclick: () => openAlbum(album) }, 'Find downloads'),
      el('button', { class: 'small', onclick: () => toggleWanted({ ...album, wanted: true }) }, 'Remove')));
}

function renderWanted() {
  $('viewWanted').replaceChildren(wanted.length
    ? el('div', { class: 'wanted-list' }, ...wanted.map(wantedRow))
    : el('div', { class: 'notice' }, el('strong', {}, 'Nothing wanted yet'), 'Add albums from an artist page or an album.'));
}

function searchFor(name) {
  setMode('artist');
  $('query').value = name;
  show('find');
  $('find').requestSubmit();
}

function showError(error) {
  $('results').replaceChildren(el('div', { class: 'notice error' }, error.message));
}

function showFresh(saved, refresh) {
  $('fresh').replaceChildren(...freshness(saved, refresh));
}

async function searchArtists(q, refresh) {
  const data = await api(`/api/artists?q=${encodeURIComponent(q)}${refresh ? '&refresh=1' : ''}`);
  searched = false;
  showFresh(data.saved_at, () => runSearch(true));
  const mine = libraryMatches();
  const known = new Set(mine.map(a => a.id));
  const others = data.artists.filter(a => !known.has(a.id));
  $('results').replaceChildren(...(others.length ? [
    ...(mine.length ? [el('h3', { class: 'section-title' }, 'Everyone else')] : []),
    el('div', { class: 'picks' }, ...others.map(artistPick))]
    : [el('div', { class: 'notice' }, mine.length ? 'Nobody else has that name.' : 'No artists with that name.')]));
}

async function runSearch(refresh = false) {
  const q = $('query').value.trim();
  if (!q) return;
  $('hiddenCount').textContent = '';
  $('fresh').replaceChildren();
  $('results').replaceChildren(el('div', { class: 'notice' }, 'Searching…'));
  try {
    if (mode === 'artist') return await searchArtists(q, refresh);
    const data = await api(`/api/search?q=${encodeURIComponent(q)}${refresh ? '&refresh=1' : ''}`);
    albums = data.albums;
    showFresh(data.saved_at, () => runSearch(true));
    searched = true;
    renderResults();
  } catch (error) { showError(error); }
}

$('find').onsubmit = event => {
  event.preventDefault();
  show('find');
  runSearch();
};

$('query').oninput = () => {
  const q = $('query').value.trim();
  const found = renderLocal();
  searched = false;
  $('fresh').replaceChildren();
  $('hiddenCount').textContent = '';
  if (q) show('find');
  $('results').replaceChildren(el('div', { class: 'notice' }, !q ? 'Search your library and everywhere else from the box above.'
    : found.length ? 'Press Enter to search everywhere too.' : `No one called \u201c${q}\u201d in your library. Press Enter to search everywhere.`));
};

function setMode(next) {
  mode = next;
  store('encore-mode', next);
  document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === next));
  $('query').placeholder = next === 'artist' ? 'Artist name' : 'Artist or album';
}

document.querySelectorAll('[data-mode]').forEach(button => {
  button.onclick = () => {
    setMode(button.dataset.mode);
    if ($('query').value.trim()) $('find').requestSubmit();
  };
});
if (stored('encore-mode') === 'artist') setMode('artist');

$('clearDone').onclick = () => act('/api/queue/clear', 'POST');

renderJobs();
refreshHealth();
loadWanted();
loadLibrary();
refreshJobs();
setInterval(refreshJobs, 2000);
setInterval(refreshHealth, 60000);
</script>
</body>
</html>
