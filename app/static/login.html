<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Encore</title>
<style>
:root { --ink: #131316; --panel: #1b1b20; --line: #34343c; --text: #f2eee6; --muted: #a5a2aa; --accent: #ef6a4c; --accent-ink: #1c0d09; --bad: #f28b82; }
* { box-sizing: border-box; }
html { color-scheme: dark; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--ink); color: var(--text); font: 16px/1.45 system-ui, "Segoe UI", Roboto, sans-serif; }
form { width: min(340px, 100%); padding: 26px; background: var(--panel); border-radius: 12px; }
h1 { margin: 0 0 18px; font: italic 500 34px/1 Georgia, "Times New Roman", serif; }
h1 span { color: var(--accent); }
label { display: grid; gap: 4px; color: var(--muted); font-size: 14px; }
input { padding: 11px 12px; background: var(--ink); border: 1px solid var(--line); border-radius: 8px; color: var(--text); font: inherit; }
button { width: 100%; margin-top: 14px; padding: 11px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 600; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
p { min-height: 22px; margin: 10px 0 0; color: var(--bad); font-size: 14px; }
</style>
</head>
<body>
<form id="login">
  <h1>Encore<span>.</span></h1>
  <label>Password <input id="password" type="password" autocomplete="current-password" autofocus required></label>
  <button>Sign in</button>
  <p id="problem" role="alert"></p>
</form>
<script>
document.getElementById('login').onsubmit = async event => {
  event.preventDefault();
  const problem = document.getElementById('problem');
  problem.textContent = '';
  try {
    const res = await fetch('/api/login', { method: 'POST', headers: { 'X-Encore': '1', 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: document.getElementById('password').value }) });
    if (res.ok) return location.replace('/');
    problem.textContent = (await res.json()).error || 'That didn’t work.';
  } catch { problem.textContent = 'Encore isn’t answering.'; }
};
</script>
</body>
</html>
